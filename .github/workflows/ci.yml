name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (test, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-extraction
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-extraction/requirements.txt
      - run: pip install -r requirements.txt
      # Tests that render through Kroki skip themselves when none is reachable.
      - run: pytest

  api:
    name: API (test scripts)
    runs-on: ubuntu-latest
    # A throwaway database per run: nothing is shared with any deployed environment.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sddg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sddg_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply schema and migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f schema.sql
          for m in migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$m"; done
      - name: Run every tests_*.py script
        run: |
          export DATA_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          for t in tests_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
